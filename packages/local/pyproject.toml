[project]
name = "sf6-chapter-local"
version = "0.1.0"
description = "SF6 YouTube動画処理ローカルスクリプト"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-pubsub>=2.39.1",
    "google-cloud-firestore>=2.28.1",
    "yt-dlp[default]>=2026.7.4",
    "opencv-python>=5.0.0.93",
    "google-genai>=2.17.0",
    "google-api-python-client>=2.198.0",
    "boto3>=1.43.67",
    "pyarrow>=25.0.0",
    "jsonschema>=4.20.0",
    "pillow>=12.3.0",
    "google-auth-oauthlib>=1.2.3",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "playwright>=1.62.0",
    "aiohttp>=3.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "E402", # module level import not at top of file (sys.path manipulation required)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true
